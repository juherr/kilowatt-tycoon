server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1000;

    # No SPA fallback (Trunk.toml: no_spa = true). Bevy probes optional `.meta`
    # files next to its assets and must get a real 404, never index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # index.html references the hashed bundle: always revalidate it so a new
    # release is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Trunk content-hashes the WASM module and its JS glue: safe to cache forever.
    # Quoted: an unquoted `{16}` is parsed as a block opener.
    location ~* "-[0-9a-f]{16}(_bg)?\.(wasm|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ /\. {
        deny all;
    }
}
